<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 背景漸層 -->
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="60%" stop-color="#0e1118"/>
      <stop offset="100%" stop-color="#06070a"/>
    </radialGradient>
    
    <!-- 賽道藍漸層 -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#005BAC"/>
    </linearGradient>

    <!-- 競速紅漸層 -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#E60012"/>
    </linearGradient>

    <!-- 光暈濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 圓角 App 外框 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- 背景科技光環 -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="url(#blueGrad)" stroke-width="6" stroke-dasharray="24 16" opacity="0.4"/>
  <circle cx="256" cy="230" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- SUI 經典俐落幾何 "S" 標誌 (帶有 Suzuki 速度斜角) -->
  <g transform="translate(146, 110)">
    <!-- 上翼片 (賽道藍) -->
    <path d="M 170 0 L 50 0 C 22 0, 0 22, 0 50 L 0 65 C 0 88, 18 106, 40 106 L 150 106 C 178 106, 200 128, 200 156 L 200 165 C 200 188, 182 206, 160 206 L 30 206 L 0 240 L 165 240 C 206 240, 240 206, 240 165 L 240 150 C 240 110, 206 75, 165 75 L 60 75 C 44 75, 35 66, 35 50 C 35 34, 48 25, 65 25 L 195 25 Z" 
          fill="url(#blueGrad)" filter="url(#glow)"/>
    
    <!-- 紅色速度動能點綴刀鋒 (競速紅) -->
    <polygon points="190,0 230,0 185,55 145,55" fill="url(#redGrad)"/>
    <polygon points="40,240 0,240 45,185 85,185" fill="url(#redGrad)"/>
  </g>

  <!-- 下方 SUI 125 專屬金屬車標文字 -->
  <g transform="translate(256, 415)" text-anchor="middle">
    <!-- 車款名 -->
    <text font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="6">
      SUI <tspan fill="#38bdf8">125</tspan>
    </text>
    <!-- 副標 -->
    <text y="30" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#94a3b8" letter-spacing="8">
      SUZUKI · MOTOLOG
    </text>
  </g>
</svg>
